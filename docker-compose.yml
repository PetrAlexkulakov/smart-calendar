services:
  postgres:
    image: postgres:16-alpine
    container_name: smart-calendar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: calendar
      POSTGRES_PASSWORD: calendar
      POSTGRES_DB: smart_calendar
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U calendar -d smart_calendar']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
